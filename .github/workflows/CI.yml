name: CI
on:
  pull_request:
    branches: [main]
#  push:
#    branches: [main]
# Cancel the previous run when a PR is updated
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'   # Latest stable release
          - 'min' # Lowest Julia version allowed by [compat]
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        exclude:
          # Oldest supported Julia only on Linux; the slow platforms test the latest release
          - {version: 'min', os: windows-latest}
          - {version: 'min', os: macos-latest}
    steps:
      - uses: actions/checkout@v4
      # Defender scanning slows precompilation (many small file writes) on Windows runners
      - name: Exclude Julia paths from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($p in @("$HOME\.julia", $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE)) {
            Add-MpPreference -ExclusionPath $p
          }
      # The tests of the extension use OutputVault: check it out next to this repository, where
      # the path source in test/ expects it
      - name: Check out OutputVault
        uses: actions/checkout@v4
        with:
          repository: elenev/OutputVault.jl
          path: ov_checkout
      - name: Move it next to the repository
        shell: bash
        run: mv ov_checkout ../OutputVault
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2  # exercise the threaded solver and simulate paths
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}