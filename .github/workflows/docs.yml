name: Documentation

on:
#  push:
#    branches:
#      - main
#    tags:
#      - '*'
  pull_request:
  workflow_dispatch:  # run on a release tag to deploy: gh workflow run docs.yml --ref vX.Y.Z

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The executed persistence guide uses the same OutputVault checkout as the test suite.
      - name: Check out OutputVault
        uses: actions/checkout@v4
        with:
          repository: elenev/OutputVault.jl
          path: ov_checkout
      - name: Move it next to the repository
        run: mv ov_checkout ../OutputVault
      
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          
      - uses: julia-actions/cache@v3
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
