name: Documentation

on:
#  push:
#    branches:
#      - main
#    tags:
#      - '*'
  pull_request:
  workflow_dispatch:  # run on a release tag to deploy: gh workflow run docs.yml --ref vX.Y.Z

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          
      - uses: julia-actions/cache@v2
      
      - uses: julia-actions/julia-buildpkg@v1
      
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}